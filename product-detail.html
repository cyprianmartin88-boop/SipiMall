    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp, query, orderBy, onSnapshot, increment, updateDoc  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBQvOgelGwlcKGaQe7XtaMeiWWZuqtyR40",
        authDomain: "sipimall.firebaseapp.com",
        projectId: "sipimall",
        storageBucket: "sipimall.firebasestorage.app",
        messagingSenderId: "949511907728",
        appId: "1:949511907728:web:92c4cb40abafef4863eb15"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let currentProductData = null;
    let unsubscribeMessages = null;

    const params = new URLSearchParams(window.location.search);
    const pid = params.get('id');

    onAuthStateChanged(auth, (user) => { 
        currentUser = user; 
        loadProductDetails(); 
    });

    async function loadProductDetails() {
        if (!pid) return;
        try {
            const docRef = doc(db, "products", pid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                currentProductData = docSnap.data();

                // 1. Jina la Bidhaa
                if (document.getElementById('product-name')) {
                    document.getElementById('product-name').innerText = currentProductData.name || 'Bidhaa';
                }

                // 2. Kategoria
                if (document.getElementById('product-cat')) {
                    document.getElementById('product-cat').innerText = currentProductData.category || 'Jumla';
                }

                // 3. Bei
                if (document.getElementById('product-price')) {
                    document.getElementById('product-price').innerText = `Tsh ${Number(currentProductData.price || 0).toLocaleString()}`;
                }
                
                const oldPriceElem = document.getElementById('product-old');
                if (oldPriceElem) {
                    if (currentProductData.oldPrice) {
                        oldPriceElem.innerText = `Tsh ${Number(currentProductData.oldPrice).toLocaleString()}`;
                        oldPriceElem.classList.remove('hidden');
                    } else {
                        oldPriceElem.classList.add('hidden');
                    }
                }

                // 4. Sifa za ziada
                if (document.getElementById('display-hali')) {
                    document.getElementById('display-hali').innerText = currentProductData.condition || 'Mpya';
                }
                if (document.getElementById('display-waranti')) {
                    document.getElementById('display-waranti').innerText = currentProductData.warranty || 'Hapana';
                }
                if (document.getElementById('display-usafirishaji')) {
                    document.getElementById('display-usafirishaji').innerText = currentProductData.delivery || 'Huru';
                }

                // 5. Maelezo ya Bidhaa
                if (document.getElementById('product-desc')) {
                    document.getElementById('product-desc').innerText = currentProductData.description || 'Hakuna maelezo yaliyowekwa.';
                }

                // 6. Picha ya Bidhaa
                const wrapper = document.getElementById('slider-wrapper');
                if (wrapper) {
                    let imgUrl = currentProductData.imageUrl || 
                                 currentProductData.image || 
                                 (currentProductData.images && currentProductData.images.length > 0 ? currentProductData.images[0] : '') || 
                                 'https://via.placeholder.com/400';

                    wrapper.innerHTML = `<div class="swiper-slide"><img src="${imgUrl}" class="w-full h-full object-cover"></div>`;
                }

                // 7. WhatsApp Button
                const whatsappBtn = document.getElementById('whatsapp-btn');
                if (whatsappBtn && currentProductData.phone) {
                    const phone = currentProductData.phone.replace(/[^0-9]/g, '');
                    const msg = encodeURIComponent(`Hujambo, natamani kununua ${currentProductData.name} kwa Tsh ${currentProductData.price}`);
                    whatsappBtn.href = `https://wa.me/${phone}?text=${msg}`;
                }
            }
        } catch (e) { 
            console.error("Kosa wakati wa kupakia bidhaa:", e); 
        }
    }

    // Function ya kutambua Seller ID kwa usalama
    function getSellerId() {
        if (!currentProductData) return null;
        return currentProductData.userId || 
               currentProductData.sellerId || 
               currentProductData.uid || 
               currentProductData.createdById || 
               "admin";
    }

    // START LIVE CHAT (Inatengeneza Unique Chat kwa kila product)
    window.startLiveChat = async () => {
        if (!currentUser) return alert("Ingia (login) kwanza ili kutuma ujumbe!");
        if (!currentProductData) return alert("Taarifa za bidhaa zinapakia, subiri kidogo...");
        if (!pid) return alert("ID ya bidhaa haijapatikana.");

        const sellerId = getSellerId();

        if (currentUser.uid === sellerId) {
            return alert("Huwezi kujitumia ujumbe mwenyewe! Jaribu kutumia akaunti tofauti kutest.");
        }

        // CHAT ID YA PEKEE KWA KILA BIDHAA (Product ID + User IDs)
        const chatId = `${pid}_${[currentUser.uid, sellerId].sort().join('_')}`;
        const pImg = currentProductData.imageUrl || currentProductData.image || (currentProductData.images ? currentProductData.images[0] : '');

        const myName = currentUser.displayName || currentUser.email?.split('@')[0] || "Mteja";
        const myPhoto = currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}`;
        
        const sellerName = currentProductData.userName || currentProductData.sellerName || "Muuzaji";
        const sellerPhoto = currentProductData.userPhoto || currentProductData.sellerPhoto || `https://ui-avatars.com/api/?name=${encodeURIComponent(sellerName)}`;

        try {
            // Tengeneza / Hifadhi document ya Chat kwenye Firestore
            await setDoc(doc(db, "conversations", chatId), {
                chatId: chatId,
                productId: pid,
                participants: [currentUser.uid, sellerId],
                timestamp: serverTimestamp(),
                productInfo: { 
                    id: pid, 
                    name: currentProductData.name || "Bidhaa", 
                    image: pImg,
                    price: currentProductData.price || 0
                },
                usersData: {
                    [currentUser.uid]: { name: myName, photo: myPhoto },
                    [sellerId]: { name: sellerName, photo: sellerPhoto }
                }
            }, { merge: true });

            console.log("Conversation created/updated successfully with ID:", chatId);

        } catch (e) { 
            console.error("Error creating chat conversation:", e);
            alert("Kuna shida imetokea wakati wa kuandaa mazungumzo: " + e.message);
        }

        // Fungua UI ya Chat Room (Popup Modal)
        if (document.getElementById('chat-product-img')) document.getElementById('chat-product-img').src = pImg;
        if (document.getElementById('chat-product-name')) document.getElementById('chat-product-name').innerText = currentProductData.name || 'Bidhaa';
        if (document.getElementById('chat-product-price')) document.getElementById('chat-product-price').innerText = `Tsh ${Number(currentProductData.price || 0).toLocaleString()}`;
        
        const chatRoomElem = document.getElementById('chat-room');
        if (chatRoomElem) chatRoomElem.style.display = 'flex';
        document.body.style.overflow = 'hidden';

        window.history.pushState({ chatOpen: true }, ''); 
        listenToMessages(chatId);
    };

    window.onpopstate = function() {
        const chatRoomElem = document.getElementById('chat-room');
        if (chatRoomElem && chatRoomElem.style.display === 'flex') {
            chatRoomElem.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    };

    // Kazi ya kuhesabu bonyezo la WhatsApp au Message pekee
async function trackHotSaleAction() {
    if (!pid) return;
    try {
        const productRef = doc(db, "products", pid);
        await updateDoc(productRef, {
            hotSalesCount: increment(1) // Inaongeza 1 kila WhatsApp au Chat inapobonyezwa
        });
        console.log("Hot Sale Action Tracked!");
    } catch (e) {
        console.error("Kosa la kusajili Hot Sale count:", e);
    }
}

// 1. Shikanisha na Kitufe cha WhatsApp
const whatsappBtn = document.getElementById('whatsapp-btn');
if (whatsappBtn) {
    whatsappBtn.addEventListener('click', () => {
        trackHotSaleAction();
    });
}

// 2. Shikanisha na Kitufe cha Live Chat / Message
// Weka wito wa function hii ndani ya window.startLiveChat
const originalStartLiveChat = window.startLiveChat;
window.startLiveChat = async () => {
    trackHotSaleAction(); // Inahesabu bonyezo la message
    if (originalStartLiveChat) await originalStartLiveChat();
};

    function listenToMessages(chatId) {
        if (unsubscribeMessages) unsubscribeMessages();
        const q = query(collection(db, "conversations", chatId, "messages"), orderBy("timestamp", "asc"));
        
        unsubscribeMessages = onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById('chat-box');
            if (!chatBox) return;
            
            chatBox.innerHTML = ""; 
            
            snapshot.forEach((doc) => {
                const msg = doc.data();
                const isMe = msg.senderId === currentUser.uid;
                
                const messageTime = msg.timestamp ? 
                    new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
                    : "...";

                const msgHtml = `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-4">
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[80%]">
                            <div class="${isMe ? 'bg-[#ff4d4d] text-white rounded-t-2xl rounded-bl-2xl' : 'bg-white text-gray-800 rounded-t-2xl rounded-br-2xl'} px-4 py-3 text-[13px] shadow-sm mb-1 break-words">
                                ${msg.text}
                            </div>
                            <span class="text-[9px] text-gray-400 font-medium px-1">${messageTime}</span>
                        </div>
                    </div>
                `;
                
                chatBox.insertAdjacentHTML('beforeend', msgHtml);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    // SEND MESSAGE
    window.sendMessage = async () => {
        const input = document.getElementById('chat-input');
        if (!input) return;

        const text = input.value.trim();
        if (!text || !currentUser || !currentProductData || !pid) return;

        const sellerId = getSellerId();
        const chatId = `${pid}_${[currentUser.uid, sellerId].sort().join('_')}`;
        const pImg = currentProductData.imageUrl || currentProductData.image || (currentProductData.images ? currentProductData.images[0] : '');

        input.value = ""; 

        try {
            const myName = currentUser.displayName || currentUser.email?.split('@')[0] || "Mteja";
            const myPhoto = currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(myName)}`;
            
            const sellerName = currentProductData.userName || currentProductData.sellerName || "Muuzaji";
            const sellerPhoto = currentProductData.userPhoto || currentProductData.sellerPhoto || `https://ui-avatars.com/api/?name=${encodeURIComponent(sellerName)}`;

            // 1. Sasisha Document Kuu ya Chat
            await setDoc(doc(db, "conversations", chatId), {
                chatId: chatId,
                productId: pid,
                participants: [currentUser.uid, sellerId],
                lastMessage: text,
                timestamp: serverTimestamp(),
                lastSenderId: currentUser.uid,
                unreadCount: increment(1),
                productInfo: { 
                    id: pid, 
                    name: currentProductData.name || "Bidhaa", 
                    image: pImg,
                    price: currentProductData.price || 0
                },
                usersData: {
                    [currentUser.uid]: { name: myName, photo: myPhoto },
                    [sellerId]: { name: sellerName, photo: sellerPhoto }
                }
            }, { merge: true });

            // 2. Tuma Ujumbe (Sub-collection)
            await addDoc(collection(db, "conversations", chatId, "messages"), {
                text: text,
                senderId: currentUser.uid,
                timestamp: serverTimestamp()
            });

        } catch (e) { 
            console.error("Error sending message:", e); 
        }
    };

    window.handleChatBack = () => {
        const chatRoomElem = document.getElementById('chat-room');
        if (chatRoomElem) chatRoomElem.style.display = 'none';
        document.body.style.overflow = 'auto';
        if (new URLSearchParams(window.location.search).get('openChat') === 'true') {
            window.location.href = 'chat-list.html';
        } else {
            history.back();
        }
    };

    // Auto-open chat logic
    const checkAutoChat = setInterval(() => {
        if (new URLSearchParams(window.location.search).get('openChat') === 'true' && currentUser && currentProductData) {
            window.startLiveChat(); 
            const cleanUrl = window.location.origin + window.location.pathname + "?id=" + pid;
            window.history.replaceState({}, '', cleanUrl);
            clearInterval(checkAutoChat); 
        }
    }, 500);
    setTimeout(() => clearInterval(checkAutoChat), 5000);

    // Enter Key Listener
    document.addEventListener('DOMContentLoaded', () => {
        const chatInput = document.getElementById('chat-input');
        if (chatInput) {
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    window.sendMessage();
                }
            });
        }
    });
</script>
</body>
</html>
