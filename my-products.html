<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidhaa Zangu - Sipimall</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .product-card { transition: all 0.3s ease; }
        .product-card:active { transform: scale(0.98); }
        .main-red { color: #ff4d4d; }
        .bg-main-red { background-color: #ff4d4d; }
        .glow-button { box-shadow: 0 0 15px rgba(255, 77, 77, 0.4); }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s ease forwards; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-32">

    <div class="bg-main-red pt-10 pb-12 px-6 rounded-b-[40px] shadow-2xl relative">
        <div class="flex justify-between items-center text-white mb-6">
            <button onclick="history.back()" class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="font-black text-xl tracking-tight">Bidhaa Zangu</h1>
            <div class="w-10"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-4 rounded-3xl text-white">
                <p class="text-[10px] font-bold uppercase opacity-70">Jumla ya Clicks</p>
                <h3 class="text-2xl font-black mt-1" id="total-clicks">0</h3>
            </div>
            <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-4 rounded-3xl text-white">
                <p class="text-[10px] font-bold uppercase opacity-70">Bidhaa Hewani</p>
                <h3 class="text-2xl font-black mt-1" id="active-products">0</h3>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[150] hidden"></div>

    <div class="px-11 -mt-1">
        <button id="open-modal-btn" class="w-full bg-gray-900 text-white py-5 rounded-[25px] font-black flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all">
            <div class="bg-[#ff4d4d] p-1 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
            </div>
            UZA BIDHAA MPYA
        </button>
    </div>

    <div class="px-6 mt-8">
        <h2 class="font-black text-gray-800 text-lg ml-2 mb-4 italic uppercase">Orodha ya Bidhaa</h2>
        <div id="product-list" class="grid grid-cols-2 gap-4">
            <p class="text-center text-gray-400 text-sm py-10 col-span-2">Unapakia bidhaa zako...</p>
        </div>
    </div>

    <!-- MODAL YA KUONGEZA / KUREKEBISHA BIDHAA -->
    <div id="add-product-modal" class="fixed bottom-0 left-0 right-0 z-[200] bg-white rounded-t-[40px] shadow-2xl transform translate-y-full transition-transform duration-500 max-w-md mx-auto overflow-y-auto max-h-[90vh]">
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mt-4 mb-2"></div>
        
        <div class="px-8 pb-10 pt-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-gray-800 italic uppercase">Maelezo ya Bidhaa</h2>
                <button id="close-modal-btn" class="bg-gray-100 p-2 rounded-full text-gray-400">✕</button>
            </div>

            <form id="product-form" class="space-y-5">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-2 tracking-widest">Aina ya Bidhaa (Category)</label>
                    <select id="p-category" required class="w-full bg-gray-50 border border-gray-100 p-4 rounded-2xl text-sm focus:outline-none focus:border-[#ff4d4d] appearance-none">
                        <option value="">Chagua Category...</option>
                        <option value="electronics">Electronics</option>
                        <option value="mobile">Mobile</option>
                        <option value="fashion">Fashion</option>
                        <option value="vehicle">Vehicle</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-2 tracking-widest">Picha za Bidhaa (Weka nyingi kwa slide)</label>
                    <div class="flex gap-2 overflow-x-auto py-2" id="image-preview-container">
                        <label class="flex-shrink-0 w-20 h-20 bg-red-50 rounded-2xl border-2 border-dashed border-[#ff4d4d] flex flex-col items-center justify-center cursor-pointer">
                            <svg class="w-6 h-6 text-[#ff4d4d]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3"/></svg>
                            <input type="file" id="multi-images" class="hidden" accept="image/*" multiple>
                        </label>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-2">Maelezo ya Bidhaa (Description)</label>
                    <textarea id="p-desc" placeholder="Elezea bidhaa yako kwa ufupi..." class="w-full bg-gray-50 border-none rounded-[20px] p-4 text-sm focus:ring-2 focus:ring-red-100 min-h-[100px]"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2">
                        <input type="text" id="p-name" placeholder="Jina la Bidhaa (mf: Lenovo IdeaPad)" required class="w-full bg-gray-50 border border-gray-100 p-4 rounded-2xl text-sm focus:border-[#ff4d4d] outline-none">
                    </div>
                    <div>
                        <input type="number" id="p-price" placeholder="Bei (TSh)" required class="w-full bg-gray-50 border border-gray-100 p-4 rounded-2xl text-sm focus:border-[#ff4d4d] outline-none">
                    </div>
                    <div>
                        <input type="number" id="p-oldPrice" placeholder="Bei ya Zamani (TSh)" class="w-full bg-gray-50 border border-gray-100 p-4 rounded-2xl text-sm focus:border-[#ff4d4d] outline-none">
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex gap-2">
                        <select id="p-condition" class="flex-1 bg-gray-50 border border-gray-100 p-4 rounded-2xl text-[12px] focus:border-[#ff4d4d] outline-none">
                            <option value="Mpya">Mpya (Brand New)</option>
                            <option value="Imetumika">Imetumika (Used)</option>
                        </select>
                        <select id="p-warranty" class="flex-1 bg-gray-50 border border-gray-100 p-4 rounded-2xl text-[12px] focus:border-[#ff4d4d] outline-none">
                            <option value="Haina Warranty">Haina Warranty</option>
                            <option value="Mwaka 1">Mwaka 1</option>
                            <option value="Miaka 2">Miaka 2</option>
                            <option value="Mwaka 3">Mwaka 3</option>
                        </select>
                    </div>
                    
                    <select id="p-shipping" class="w-full bg-gray-50 border border-gray-100 p-4 rounded-2xl text-[12px] focus:border-[#ff4d4d] outline-none">
                        <option value="Usafiri ni Bure (Free Delivery)">Usafiri ni Bure (Free Delivery)</option>
                        <option value="Mteja analipia usafiri">Mteja analipia usafiri</option>
                        <option value="Makubaliano (Negotiable)">Makubaliano (Negotiable)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-[#ff4d4d] text-white py-4 rounded-2xl font-black shadow-lg shadow-red-100 active:scale-95 transition-all uppercase tracking-widest">
                    Weka Sokoni
                </button>
            </form>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module">
    // 1. FIREBASE IMPORTS
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 2. FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBQvOgelGwlcKGaQe7XtaMeiWWZuqtyR40",
        authDomain: "sipimall.firebaseapp.com",
        projectId: "sipimall",
        storageBucket: "sipimall.firebasestorage.app",
        messagingSenderId: "949511907728",
        appId: "1:949511907728:web:92c4cb40abafef4863eb15",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let editingProductId = null; 
    let productImagesBase64 = []; 

    // --- HELPER: KUSOMA PICHA KUTOKA KILA AINA YA DATA ---
    function getImageUrl(item) {
        if (!item) return 'https://via.placeholder.com/300?text=No+Image';
        
        // 1. Angalia imageUrl
        if (typeof item.imageUrl === 'string' && item.imageUrl.trim() !== '') return item.imageUrl;
        if (item.imageUrl && typeof item.imageUrl === 'object' && item.imageUrl.url) return item.imageUrl.url;
        
        // 2. Angalia image
        if (typeof item.image === 'string' && item.image.trim() !== '') return item.image;
        if (item.image && typeof item.image === 'object' && item.image.url) return item.image.url;
        
        // 3. Angalia images (array)
        if (Array.isArray(item.images) && item.images.length > 0) {
            const first = item.images[0];
            if (typeof first === 'string' && first.trim() !== '') return first;
            if (first && typeof first === 'object' && first.url) return first.url;
        } else if (typeof item.images === 'string' && item.images.trim() !== '') {
            return item.images;
        }
        
        return 'https://via.placeholder.com/300?text=No+Image';
    }

    // --- 3. IMAGE COMPRESSOR ---
    const compressImage = async (base64Str, maxWidth = 800, maxHeight = 800) => {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > height) {
                    if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                } else {
                    if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.onerror = () => resolve(base64Str);
        });
    };

    // --- 4. MODAL & OVERLAY CONTROL ---
    const modal = document.getElementById('add-product-modal');
    const overlay = document.getElementById('modal-overlay');
    const openBtn = document.getElementById('open-modal-btn');
    const closeBtn = document.getElementById('close-modal-btn');
    const productForm = document.getElementById('product-form');
    const previewContainer = document.getElementById('image-preview-container');

    const openModal = () => {
        editingProductId = null;
        productImagesBase64 = [];
        productForm.reset();
        const submitBtn = productForm.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.innerText = "Weka Sokoni";
        
        previewContainer.querySelectorAll('.preview-item').forEach(i => i.remove());
        overlay.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('translate-y-full'), 10);
    };

    const closeModal = () => {
        modal.classList.add('translate-y-full');
        setTimeout(() => {
            overlay.classList.add('hidden');
            productForm.reset();
            editingProductId = null;
            productImagesBase64 = [];
        }, 500);
    };

    if(openBtn) openBtn.onclick = openModal;
    if(closeBtn) closeBtn.onclick = closeModal;
    if(overlay) overlay.onclick = closeModal;

    // --- 5. EDIT FUNCTION ---
    window.editProduct = (id, name, price, oldPrice, category, description = "", condition = "Mpya", warranty = "Haina Warranty", delivery = "Usafiri ni Bure (Free Delivery)") => {
        editingProductId = id; 
        document.getElementById('p-name').value = name;
        document.getElementById('p-price').value = price;
        document.getElementById('p-oldPrice').value = oldPrice;
        document.getElementById('p-category').value = category;
        
        const descField = document.getElementById('p-desc');
        if(descField) descField.value = description;

        if(document.getElementById('p-condition')) document.getElementById('p-condition').value = condition;
        if(document.getElementById('p-warranty')) document.getElementById('p-warranty').value = warranty;
        if(document.getElementById('p-shipping')) document.getElementById('p-shipping').value = delivery;

        const submitBtn = productForm.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.innerText = "Rekebisha Bidhaa";
        
        overlay.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('translate-y-full'), 10);
    };
    
    window.boostProduct = () => {
        Swal.fire({
            title: 'Coming Soon!',
            text: 'Huduma ya ku-boost bidhaa itapatikana hivi karibuni.',
            icon: 'info',
            confirmButtonColor: '#ff4d4d'
        });
    };

    // --- 6. IMAGE HANDLING ---
    const imageInput = document.getElementById('multi-images');

    if(imageInput) {
        imageInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            
            for (const file of files) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                await new Promise((resolve) => {
                    reader.onload = async (event) => {
                        const compressed = await compressImage(event.target.result);
                        productImagesBase64.push(compressed);
                        
                        const div = document.createElement('div');
                        div.className = "preview-item flex-shrink-0 w-20 h-20 rounded-2xl bg-cover bg-center border border-red-100 relative animate-pop";
                        div.style.backgroundImage = `url('${compressed}')`;
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.innerHTML = "×";
                        removeBtn.className = "absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-sm font-bold";
                        removeBtn.onclick = (event) => {
                            event.preventDefault();
                            div.remove();
                            productImagesBase64 = productImagesBase64.filter(img => img !== compressed);
                        };
                        
                        div.appendChild(removeBtn);
                        previewContainer.appendChild(div);
                        resolve();
                    };
                });
            }
            imageInput.value = "";
        });
    }

    // --- 7. DELETE PRODUCT ---
    window.deleteProduct = async (productId) => {
        const result = await Swal.fire({
            title: 'Una uhakika?',
            text: "Bidhaa itafutwa kabisa!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ff4d4d',
            confirmButtonText: 'Ndio, Futa!'
        });
        if (result.isConfirmed) {
            try {
                await deleteDoc(doc(db, "products", productId));
                Swal.fire('Imefutwa!', 'Bidhaa imeondolewa.', 'success');
            } catch (err) { Swal.fire('Kosa!', err.message, 'error'); }
        }
    };

    // --- 8. SUBMIT TO FIREBASE ---
    productForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!user) return Swal.fire('Login!', 'Tafadhali ingia kwanza.', 'info');

        if (productImagesBase64.length === 0 && !editingProductId) {
            return Swal.fire('Picha!', 'Weka angalau picha moja.', 'warning');
        }

        const submitBtn = productForm.querySelector('button[type="submit"]');
        submitBtn.innerText = "Inasindika...";
        submitBtn.disabled = true;

        try {
            const data = {
                category: document.getElementById('p-category').value,
                name: document.getElementById('p-name').value,
                price: Number(document.getElementById('p-price').value),
                oldPrice: Number(document.getElementById('p-oldPrice')?.value || 0),
                description: document.getElementById('p-desc').value,
                condition: document.getElementById('p-condition').value,
                warranty: document.getElementById('p-warranty').value,
                delivery: document.getElementById('p-shipping').value,
                updatedAt: serverTimestamp()
            };

            // Kama picha mpya zimewekwa
            if (productImagesBase64.length > 0) {
                const firstImg = productImagesBase64[0];
                data.image = firstImg;
                data.imageUrl = firstImg;
                data.images = productImagesBase64;
            }

            if (editingProductId) {
                await updateDoc(doc(db, "products", editingProductId), data);
                Swal.fire({ title: 'Imekamilika!', text: 'Bidhaa imerekebishwa.', icon: 'success', timer: 1500 });
            } else {
                data.userId = user.uid;
                data.clicks = 0;
                data.createdAt = serverTimestamp();
                
                const firstImg = productImagesBase64[0] || '';
                data.image = firstImg;
                data.imageUrl = firstImg;
                data.images = productImagesBase64;

                await addDoc(collection(db, "products"), data);
                Swal.fire({ title: 'Hongera!', text: 'Bidhaa imepakiwa.', icon: 'success', timer: 1500 });
            }

            closeModal();
        } catch (err) {
            Swal.fire('Kosa!', err.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Weka Sokoni";
        }
    });

    // --- 9. DISPLAY PRODUCTS ---
    const displayProducts = (user) => {
        const list = document.getElementById('product-list');
        const activeCount = document.getElementById('active-products');
        const totalClicksElem = document.getElementById('total-clicks');
        
        const q = query(collection(db, "products"), where("userId", "==", user.uid));

        onSnapshot(q, (snapshot) => {
            if(activeCount) activeCount.innerText = snapshot.size;
            let totalClicks = 0;
            let html = "";

            snapshot.forEach((pDoc) => {
                const item = pDoc.data();
                const id = pDoc.id;

                totalClicks += (item.clicks || 0);

                const cleanDesc = (item.description || "").replace(/'/g, "\\'").replace(/\n/g, " ");
                const cleanName = (item.name || "").replace(/'/g, "\\'");
                
                // Tunapata Picha kwa uhakika hapa:
                const displayImg = getImageUrl(item);

                html += `
                <div class="bg-white rounded-[30px] p-3 shadow-sm border border-gray-50 flex flex-col relative animate-pop">
                    <div class="absolute top-4 right-4 flex flex-col gap-2 z-10">
                        <button onclick="deleteProduct('${id}')" class="bg-white/90 p-2 rounded-full shadow text-red-500 active:scale-90">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"/></svg>
                        </button>
                        <button onclick="editProduct('${id}', '${cleanName}', ${item.price}, ${item.oldPrice || 0}, '${item.category}', '${cleanDesc}', '${item.condition || 'Mpya'}', '${item.warranty || 'Haina Warranty'}', '${item.delivery || 'Usafiri ni Bure (Free Delivery)'}')" class="bg-white/90 p-2 rounded-full shadow text-blue-500 active:scale-90">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2"/></svg>
                        </button>
                    </div>
                    <div class="w-full aspect-square rounded-[25px] overflow-hidden bg-gray-50 mb-3">
                        <img src="${displayImg}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300?text=No+Image';" class="w-full h-full object-cover">
                    </div>
                    <div class="px-1 flex-1">
                        <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">${item.category}</p>
                        <h3 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2 mt-0.5">${item.name}</h3>
                        <div class="mt-2">
                            ${item.oldPrice > 0 ? `<p class="text-[10px] text-gray-300 line-through font-bold">TSh ${item.oldPrice.toLocaleString()}</p>` : ''}
                            <p class="text-[#ff4d4d] font-black text-md">TSh ${Number(item.price).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="mt-3 flex justify-end">
                        <button onclick="boostProduct()" class="bg-red-50 text-[#ff4d4d] p-2 px-3 rounded-2xl flex items-center gap-1 active:scale-90 transition-all">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2"/></svg>
                            <span class="text-[9px] font-black italic uppercase">Boost</span>
                        </button>
                    </div>
                </div>`;
            });

            if(totalClicksElem) totalClicksElem.innerText = totalClicks;
            list.innerHTML = html || `<p class="col-span-2 text-center py-10 opacity-40">Hakuna bidhaa hapa.</p>`;
        });
    };

    // --- 10. AUTHENTICATION ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            displayProducts(user);
        } else {
            document.getElementById('product-list').innerHTML = `<p class="col-span-2 text-center py-10 opacity-40">Ingia kuona bidhaa zako.</p>`;
        }
    });
</script>
</body>
</html>
