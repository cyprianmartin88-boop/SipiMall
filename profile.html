    <script type="module">
  // 1. Ingiza Huduma tunazohitaji (App, Analytics, Auth, na Firestore)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp,onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 2. Config yako (Iliyoboreshwa kidogo)
  const firebaseConfig = {
    apiKey: "AIzaSyBQvOgelGwlcKGaQe7XtaMeiWWZuqtyR40",
    authDomain: "sipimall.firebaseapp.com",
    projectId: "sipimall",
    storageBucket: "sipimall.firebasestorage.app",
    messagingSenderId: "949511907728",
    appId: "1:949511907728:web:92c4cb40abafef4863eb15",
    measurementId: "G-QGHGDN9C09"
  };

  // 3. Initialize Firebase Services
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // --- HUDUMA ZA LOGIN (Google Sign-In) ---
  
 // Hakikisha hii ipo ndani ya script type="module"
window.loginWithGoogle = async () => {
    try {
        console.log("Jaribio la Login limeanza...");
        const result = await signInWithPopup(auth, provider);
        // Login imefanikiwa
        console.log("Imefanikiwa!");
    } catch (error) {
        console.error("Kosa la Login:", error.code, error.message);
        if (error.code === 'auth/operation-not-allowed') {
            alert("Kumbuka kuwasha Google Provider kule Firebase Console!");
        } else {
            alert("Kuna shida: " + error.message);
        }
    }
};
// Ongeza hii ndani ya script yako
window.logout = async () => {
    try {
        await signOut(auth);
        console.log("Mtumiaji ametoka!");
        // Unaweza pia kumpeleka page nyingine akishatoka
        // window.location.href = 'index.html'; 
    } catch (error) {
        console.error("Kosa wakati wa kutoka:", error.message);
    }
};

 // Kufuatilia hali ya mtumiaji (Login Status)
  onAuthStateChanged(auth, (user) => {
    const profileCard = document.getElementById('profile-card');
    const guestCard = document.getElementById('guest-card');
    const mainMenu = document.getElementById('main-menu');

    if (user) {
      // 1. Mtumiaji ameingia: Onyesha Profile na Menyu
      guestCard.classList.add('hidden');
      profileCard.classList.remove('hidden');
      mainMenu.classList.remove('hidden');

      // 2. Jaza Data za mtumiaji
      document.getElementById('user-name').innerText = user.displayName.toUpperCase();
      document.getElementById('user-email').innerText = user.email;
      document.getElementById('user-photo').src = user.photoURL;

      console.log("Mtumiaji yupo ndani:", user.displayName);
    } else {
      // 3. Hakuna mtumiaji: Onyesha Guest Card pekee
      guestCard.classList.remove('hidden');
      profileCard.classList.add('hidden');
      mainMenu.classList.add('hidden');

      console.log("Mtumiaji ametoka (Guest Mode)");
    }
  });
  onAuthStateChanged(auth, (user) => {
    if (user) {
        const badge = document.getElementById('total-unread-badge');
        
        // Tafuta machat ambapo user yupo na kuna meseji ambayo haijasomwa
        const q = query(
            collection(db, "conversations"),
            where("participants", "array-contains", user.uid)
        );

        onSnapshot(q, (snapshot) => {
            let unreadTotal = 0;
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                // Hesabu tu ikiwa:
                // 1. unreadCount ni zaidi ya 0
                // 2. Mtu aliyetuma meseji ya mwisho SIYO mimi
                if (data.unreadCount > 0 && data.lastSenderId !== user.uid) {
                    unreadTotal++;
                }
            });

            if (unreadTotal > 0) {
                badge.innerText = unreadTotal;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        });
    }
});

  // Export db na auth ili zitumike kwingine (hiari)
  window.db = db;
  window.auth = auth;

</script>
